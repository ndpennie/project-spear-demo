name: Scheduled sweep

# Always-on searching without a server to babysit.
# GitHub runs this on a timer, it calls the same /api/search the dashboard uses,
# and it commits sweep.json back into the site. The dashboard's "Watch" button
# reads that file and shows the analyst only what is new since they last looked.
#
# Nothing here scores, reports, or acts on anything. It gathers unscored leads.

on:
  schedule:
    # Every 6 hours. GitHub cron is UTC and can run a few minutes late under load.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: spear-sweep
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit sweep.json back to the repo

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the sweep
        env:
          SPEAR_API: ${{ vars.SPEAR_API || 'https://project-spear-backend.onrender.com' }}
        run: python scripts/sweep.py

      - name: Commit sweep.json if it changed
        run: |
          if git diff --quiet -- sweep.json; then
            echo "No change — nothing new this run."
            exit 0
          fi
          git config user.name  "project-spear-sweep"
          git config user.email "noreply@users.noreply.github.com"
          git add sweep.json
          git commit -m "Scheduled sweep: $(python -c 'import json;print(json.load(open("sweep.json"))["count"])') lead(s)"
          git push
