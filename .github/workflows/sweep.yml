name: Scheduled sweep

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: spear-sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the sweep
        env:
          SPEAR_API: ${{ vars.SPEAR_API || 'https://project-spear-backend.onrender.com' }}
        run: python sweep.py

      - name: Commit sweep.json if it changed
        run: |
          if git diff --quiet -- sweep.json; then
            echo "No change — nothing new this run."
            exit 0
          fi
          git config user.name  "project-spear-sweep"
          git config user.email "noreply@users.noreply.github.com"
          git add sweep.json
          git commit -m "Scheduled sweep"
          git push
